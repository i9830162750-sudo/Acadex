<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e0f13"><link rel="manifest" href="/manifest.json"><title>Install Acadex</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0e0f13;color:#eef0f5;font-family:system-ui,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(420px,100%);padding:30px 24px;text-align:center;background:#17181f;border:1px solid #262832;border-radius:22px}.icon{width:80px;height:80px;border-radius:20px;margin-bottom:18px}h1{margin:0 0 8px}p{color:#a2a6b5;line-height:1.55;font-size:14px;margin:0 0 20px}button{width:100%;border:0;border-radius:12px;padding:13px;background:#8b8df2;color:#fff;font-weight:800}.hint{margin-top:12px;color:#777d90;font-size:12px;line-height:1.5}</style></head><body><main class="card"><img class="icon" src="/icons/acadex-icon.svg"><h1>Install Acadex</h1><p>Acadex mobile runs as an installed app. Install it to use the full app without browser UI.</p><button id="install">Install Acadex</button><div class="hint" id="hint">If no prompt appears, use your browser menu and choose “Add to Home screen” or “Install app”.</div></main><script>let d=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();d=e});install.onclick=async()=>{if(d){d.prompt();await d.userChoice;d=null}else hint.textContent='Open your browser menu and choose “Add to Home screen” or “Install app”.'}</script></body></html>

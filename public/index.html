<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>Acadex</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e0f13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acadex">
<link rel="apple-touch-icon" href="/icons/acadex-icon.svg">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0e0f13;color:#eef0f5;font-family:Inter,system-ui,-apple-system,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(420px,100%);text-align:center}
.icon{width:88px;height:88px;border-radius:22px;display:block;margin:0 auto 22px;box-shadow:0 18px 50px #0008}
h1{margin:0 0 8px;font-size:28px;letter-spacing:-.02em}
#status{margin:0;color:#a2a6b5;font-size:14px;line-height:1.55}
.spinner{width:24px;height:24px;border:3px solid #292a35;border-top-color:#8b8df2;border-radius:50%;animation:spin .8s linear infinite;margin:22px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
#install-wrap{display:none;margin-top:24px}
#installBtn{width:100%;border:0;border-radius:12px;padding:13px 16px;background:#8b8df2;color:#fff;font:800 15px Inter,system-ui,sans-serif;cursor:pointer}
.hint{margin-top:12px;color:#777d90;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <img class="icon" src="/icons/acadex-icon.svg" alt="Acadex" onerror="this.style.display='none'">
  <h1 id="title">Acadex</h1>
  <p id="status">Starting…</p>
  <div class="spinner" id="spinner"></div>
  <div id="install-wrap">
    <button id="installBtn" type="button">Install Acadex</button>
    <div class="hint" id="hint">Or use your browser menu → "Add to Home screen" / "Install app".</div>
  </div>
</main>
<script>
(function(){
  var APP = '/app/acadex-app-7f3c9e21';
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  var title  = document.getElementById('title');
  var status = document.getElementById('status');
  var spinner = document.getElementById('spinner');
  var installWrap = document.getElementById('install-wrap');
  var deferred = null;

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
  });

  // Already installed (standalone PWA) — go straight to app, no ping needed
  // The app itself handles offline state
  if (standalone) {
    title.textContent = 'Opening Acadex…';
    status.textContent = 'Loading your workspace…';
    location.replace(APP);
    return;
  }

  // Mobile browser — not installed — show install prompt
  if (mobile) {
    title.textContent = 'Install Acadex';
    status.textContent = 'Acadex works best as an installed app.';
    spinner.style.display = 'none';
    installWrap.style.display = 'block';
    document.getElementById('installBtn').addEventListener('click', async function(){
      if (deferred) {
        deferred.prompt();
        await deferred.userChoice;
        deferred = null;
      } else {
        document.getElementById('hint').textContent = 'Use your browser menu → "Add to Home screen" or "Install app".';
      }
    });
    return;
  }

  // Desktop browser — ping /api/health client-side before going to app
  // This runs entirely in the browser — Render is NOT needed to serve this page
  // because the SW caches it. The user sees this screen while Render cold-starts.
  title.textContent = 'Waking Acadex…';
  status.textContent = 'Connecting to the server…';

  function ping() {
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, 9000);
    fetch('/api/health?t=' + Date.now(), {
      cache: 'no-store',
      signal: controller.signal
    }).then(function(r){
      clearTimeout(timer);
      if (r.ok) {
        status.textContent = 'Server is ready. Opening Acadex…';
        setTimeout(function(){ location.replace(APP); }, 150);
      } else {
        throw new Error('not ready');
      }
    }).catch(function(){
      clearTimeout(timer);
      status.textContent = 'Server is waking up… checking again in 10 s';
      setTimeout(ping, 10000);
    });
  }

  ping();
})();
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}
</script>
</body>
</html>
